name: Syswatch
description: Syswatch offline-first workstation monitoring and authentication.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0

  crypto: ^3.0.6
  uuid: ^4.5.1

  window_manager: ^0.5.0
  tray_manager: ^0.5.3
  launch_at_startup: ^0.5.1
  package_info_plus: ^8.3.1

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tray/app_icon.ico